<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Free Library — Item Details</title>

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- ══ link interceptors (keep the Mini App from closing on external links) ══ -->
<script>
(function() {
  var _origOpen = window.open;
  window.open = function(url, target, features) {
    if (url && typeof url === 'string' && url.indexOf('http') === 0) {
      var tgApp = window.Telegram && window.Telegram.WebApp;
      if (tgApp && typeof tgApp.openLink === 'function') {
        try { tgApp.openLink(url, { try_instant_view: false }); return null; } catch (e) {}
      }
      return _origOpen.call(window, url, '_blank', features);
    }
    return _origOpen.apply(window, arguments);
  };
})();
</script>

<!-- tads.me SDK (only ad provider) -->
<script src="https://w.tads.me/widget.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:             #F3EDE0;
    --card:           #FFFFFF;
    --text:           #2E2B1F;
    --text-muted:     #83795F;
    --border:         #E3D9C2;
    --accent:         #6B7A3D;
    --accent-dark:    #4F5C2C;
    --accent-pale:    #EAF0DD;
    --radius-card:    20px;
    --radius-btn:     10px;
    --shadow-card:    0 4px 24px rgba(46,43,31,.10);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:0;overflow-x:hidden;}
  .app-shell{width:100%;max-width:440px;margin:0 auto;}

  .header-bar{width:100%;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
    padding:16px 18px 46px;display:flex;align-items:center;gap:10px;}
  .back-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;
    border:none;cursor:pointer;flex-shrink:0;}
  .logo-text{font-size:16px;font-weight:800;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .points-badge{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;font-size:11.5px;font-weight:800;
    padding:5px 11px;border-radius:20px;flex-shrink:0;display:flex;align-items:center;gap:4px;}

  .card{width:100%;margin:-28px 0 0;background:var(--card);border-radius:24px 24px 0 0;
    box-shadow:0 -6px 24px rgba(46,43,31,.08);padding:22px 18px 24px;position:relative;z-index:2;
    display:none;animation:slideUp .45s cubic-bezier(.22,.61,.36,1) both;}
  .card.visible{display:block;}
  @keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  .item-info{display:flex;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .item-thumb{width:76px;height:96px;border-radius:10px;background:var(--accent);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
  .item-meta{flex:1;min-width:0;}
  .item-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;line-height:1.35;margin-bottom:6px;}
  .item-desc{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:8px;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--accent-pale);color:var(--accent-dark);}
  .tag.free-tag{background:var(--accent);color:#fff;}

  /* ── status panel: shows free-downloads-left / points, no gating ── */
  .status-panel{background:var(--accent-pale);border-radius:14px;padding:14px 16px;margin:14px 0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .status-item{text-align:center;flex:1;}
  .status-num{font-size:20px;font-weight:800;color:var(--accent-dark);font-family:'Playfair Display',serif;}
  .status-label{font-size:10.5px;color:var(--text-muted);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.02em;}
  .status-divider{width:1px;align-self:stretch;background:var(--border);}

  /* ── primary CTA: always reflects real availability, never a fake lock ── */
  .cta-btn{display:block;width:100%;padding:15px;border-radius:var(--radius-btn);border:none;
    background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px;
    transition:opacity .15s;}
  .cta-btn:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;}
  .cta-btn:active:not(:disabled){opacity:.9;}

  /* ── optional ad-for-points section, clearly separated & optional ── */
  .earn-section{border-top:1px dashed var(--border);margin-top:14px;padding-top:14px;}
  .earn-headline{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:8px;text-align:center;}
  .earn-sub{font-size:11.5px;color:var(--text-muted);text-align:center;margin-bottom:12px;line-height:1.5;}
  .ad-btn{display:block;width:100%;padding:12px;border-radius:var(--radius-btn);border:1.5px solid var(--accent);
    background:#fff;color:var(--accent-dark);font-weight:800;font-size:13.5px;cursor:pointer;}
  .ad-btn.watching{opacity:.6;}
  .ad-btn:disabled{opacity:.5;cursor:not-allowed;}

  .toast{display:none;text-align:center;font-size:12.5px;color:var(--accent-dark);
    background:var(--accent-pale);border-radius:10px;padding:10px;margin-top:10px;font-weight:700;}
  .toast.visible{display:block;}
  .toast.error{color:#8a3a2b;background:#FBE7E1;}

  .more-btn{display:block;width:100%;text-align:center;padding:12px;margin-top:12px;border-radius:var(--radius-btn);
    background:transparent;border:1.5px solid var(--border);color:var(--text);font-weight:700;font-size:13px;
    text-decoration:none;cursor:pointer;}

  .disclaimer-note{font-size:11px;color:var(--text-muted);text-align:center;margin-top:18px;line-height:1.5;}
  #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99;display:none;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="header-bar">
    <button class="back-btn" onclick="history.back()">‹</button>
    <div class="logo-text">Free Library</div>
  </div>

  <div class="card" id="main-card">
    <div class="item-info">
      <div class="item-thumb" id="item-thumb">📖</div>
      <div class="item-meta">
        <div class="item-title" id="item-title">Loading…</div>
        <div class="item-desc" id="item-desc"></div>
        <div class="tags">
          <span class="tag" id="item-size"></span>
          <span class="tag" id="item-pages" style="display:none"></span>
          <span class="tag free-tag">FREE</span>
        </div>
      </div>
    </div>

    <!-- Unlock flow: watch 2 short ads, then the download link opens. -->
    <button class="cta-btn" id="btn-unlock" onclick="unlockDownload()">🔓 Unlock Download (watch 2 short ads)</button>
    <div class="toast" id="toast"></div>

    <a class="more-btn" id="more-link" href="#">🔎 More from this category</a>

    <div class="disclaimer-note">
      This is a free public-domain / open-source resource. No copyrighted
      or paid material is hosted here. Watching 2 short ads unlocks the
      download link — no payment, no account needed.
    </div>
  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); if (tg.disableClosingConfirmation) tg.disableClosingConfirmation(); }

// ── config ──────────────────────────────────────────────────
// Public, read-only Supabase credentials. The anon key can ONLY call
// the RPC functions below (see schema_user_downloads.sql) — it has
// zero direct table access, so this stays safe to ship client-side.
const SUPABASE_URL      = 'https://xokzxnslfrcnfdopcxqj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_rc349sSa3juCMjxVTMQUng_HQo23ZJF';
const TADS_WIDGET_1     = '9607';   // DataPi banner
const TADS_WIDGET_2     = '9969';   // DataPi banner 2
const TADS_DEBUG        = false;    // set true only while testing
const AD_TIMEOUT_MS     = 15000;

const CATEGORY_LABEL = { book: 'Books', summary: 'Cheat Sheets', project: 'Projects', article: 'Articles' };
const CATEGORY_EMOJI = { book: '📖', summary: '📝', project: '💻', article: '📰' };

let item          = null;
let telegramId    = null;
let unlocking     = false;

// ── telegram user id ───────────────────────────────────────
function getTelegramId() {
  const fromTg = tg?.initDataUnsafe?.user?.id;
  if (fromTg) return fromTg;
  // fallback for testing outside Telegram (?debug_uid=123)
  const dbg = new URLSearchParams(window.location.search).get('debug_uid');
  return dbg ? Number(dbg) : null;
}

// ── tads.me: wait for SDK to be ready ───────────────────────
function waitForTadsReady(timeout = AD_TIMEOUT_MS) {
  return new Promise((resolve, reject) => {
    if (window.tads && typeof window.tads.init === 'function') { resolve(); return; }
    const start = performance.now();
    const iv = setInterval(() => {
      if (window.tads && typeof window.tads.init === 'function') {
        clearInterval(iv); resolve();
      } else if (performance.now() - start > timeout) {
        clearInterval(iv); reject(new Error('tads.me SDK not loaded'));
      }
    }, 50);
  });
}

// ── tads.me: show one fullscreen rewarded ad, resolve true/false ──
async function showTadsAd(widgetId) {
  try {
    await waitForTadsReady();
  } catch (e) {
    console.error(e);
    return false;
  }
  return new Promise((resolve) => {
    let settled = false;
    const done = (ok) => { if (settled) return; settled = true; resolve(ok); };
    const timer = setTimeout(() => done(false), AD_TIMEOUT_MS);

    const adController = window.tads.init({
      widgetId: widgetId,
      type: 'fullscreen',
      debug: TADS_DEBUG,
      onShowReward: () => { clearTimeout(timer); done(true); },
      onAdsNotFound: () => { clearTimeout(timer); done(false); },
    });

    Promise.resolve(adController)
      .then((ctrl) => ctrl.showAd())
      .catch((err) => { console.error('tads showAd error', err); clearTimeout(timer); done(false); });
  });
}

// ── start_param decode ─────────────────────────────────────
function b64urlDecode(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function getStartParam() {
  return tg?.initDataUnsafe?.start_param
      || new URLSearchParams(window.location.search).get('startapp')
      || new URLSearchParams(window.location.search).get('id');
}

async function loadItem() {
  let itemId = null;
  const raw = getStartParam();
  if (raw) {
    try {
      const parsed = JSON.parse(b64urlDecode(raw));
      if (parsed && parsed.id) itemId = parsed.id;
    } catch (e) {
      if (/^\d+$/.test(raw)) itemId = Number(raw);
    }
  }
  if (!itemId) itemId = new URLSearchParams(window.location.search).get('id');

  try {
    const endpoint = `${SUPABASE_URL}/rest/v1/items?select=*&id=eq.${encodeURIComponent(itemId)}`;
    const res = await fetch(endpoint, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    const data = await res.json();
    item = data && data[0];
  } catch (e) {
    console.error('Failed to load item from Supabase', e);
  }

  if (!item) {
    document.getElementById('item-title').textContent = 'Item not found';
    return;
  }

  document.getElementById('item-title').textContent = item.title;
  document.getElementById('item-desc').textContent = item.description || '';
  document.getElementById('item-size').textContent = item.size_str || '';
  if (item.page_count) {
    const pg = document.getElementById('item-pages');
    pg.style.display = 'inline-block';
    pg.textContent = item.page_count + ' pages';
  }
  const thumb = document.getElementById('item-thumb');
  if (item.cover_url) {
    thumb.innerHTML = `<img src="${item.cover_url}" alt="cover" onerror="this.parentElement.textContent='${CATEGORY_EMOJI[item.category] || '📄'}'" />`;
  } else {
    thumb.textContent = CATEGORY_EMOJI[item.category] || '📄';
  }

  const moreLink = document.getElementById('more-link');
  const label = CATEGORY_LABEL[item.category] || 'items';
  moreLink.textContent = `🔎 More ${label}`;
  const morePayload = { page: 'index', cat: item.category };
  const encoded = btoa(JSON.stringify(morePayload)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  moreLink.href = `index.html?startapp=${encoded}`;

  telegramId = getTelegramId();
  showCard();
}

function showCard() { document.getElementById('main-card').classList.add('visible'); }

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible' + (isError ? ' error' : '');
}

// ── primary action: watch 2 ads in sequence, then open the file ────
async function unlockDownload() {
  if (unlocking || !item) return;
  unlocking = true;
  const btn = document.getElementById('btn-unlock');
  btn.disabled = true;

  btn.textContent = '⏳ Loading ad 1 of 2…';
  const ok1 = await showTadsAd(TADS_WIDGET_1);
  if (!ok1) {
    showToast('No ad available right now — please try again.', true);
    btn.textContent = '🔓 Unlock Download (watch 2 short ads)';
    btn.disabled = false;
    unlocking = false;
    return;
  }

  btn.textContent = '⏳ Loading ad 2 of 2…';
  const ok2 = await showTadsAd(TADS_WIDGET_2);
  if (!ok2) {
    showToast('No ad available right now — please try again.', true);
    btn.textContent = '🔓 Unlock Download (watch 2 short ads)';
    btn.disabled = false;
    unlocking = false;
    return;
  }

  openFile();
  showToast('✅ Unlocked! Opening your download…');
  launchConfetti();
  btn.textContent = '📥 Download Again';
  btn.disabled = false;
  unlocking = false;
}

function openFile() {
  const url = item.file_url;
  if (tg && typeof tg.openLink === 'function') {
    tg.openLink(url, { try_instant_view: false });
  } else {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.click();
  }
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#6B7A3D', '#FFFFFF', '#4F5C2C', '#2E2B1F', '#F3EDE0', '#A3B36C'];
  const pieces = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 3, d: Math.random() * 2 + 1,
    color: colors[Math.floor(Math.random()*colors.length)],
    tilt: Math.random()*10-5, tiltSpeed: (Math.random()*.07+.03) * (Math.random()<.5?1:-1),
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.beginPath(); ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r*0.4, p.tilt, 0, Math.PI*2); ctx.fill();
      p.y += p.d + frame/80; p.tilt += p.tiltSpeed; p.x += Math.sin(frame/20) * 0.5;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
    });
    frame++;
    if (frame < 150) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

window.addEventListener('load', loadItem);
</script>
</body>
</html>
