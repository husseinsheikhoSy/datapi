<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Free Library — Item Details</title>

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- Monetag SDK — Rewarded Popup zone -->
<script src='//libtl.com/sdk.js' data-zone='11714447' data-sdk='show_11714447'></script>

<script>
(function() {
  var _origOpen = window.open;
  window.open = function(url, target, features) {
    if (url && typeof url === 'string' && url.indexOf('http') === 0) {
      var tgApp = window.Telegram && window.Telegram.WebApp;
      if (tgApp && typeof tgApp.openLink === 'function') {
        try { tgApp.openLink(url, { try_instant_view: false }); return null; } catch (e) {}
      }
      return _origOpen.call(window, url, '_blank', features);
    }
    return _origOpen.apply(window, arguments);
  };
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:             #0B1730;
    --bg-2:           #0F1F42;
    --card:           #142650;
    --text:           #EEF1F8;
    --text-muted:     #9AA6C4;
    --border:         #24365F;
    --accent:         #FF4FA0;
    --accent-dark:    #D6338A;
    --accent-pale:    rgba(255,79,160,.14);
    --silver:         #C7CEDD;
    --silver-dim:     #7C87A3;
    --radius-card:    20px;
    --radius-btn:     10px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:0;overflow-x:hidden;}
  .app-shell{width:100%;max-width:440px;margin:0 auto;}

  .header-bar{width:100%;background:linear-gradient(135deg,var(--bg-2) 0%,#1B2F5E 60%,var(--accent-dark) 140%);
    padding:16px 18px 46px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .back-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;
    border:none;cursor:pointer;flex-shrink:0;}
  .logo-text{font-size:16px;font-weight:800;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .card{width:100%;margin:-28px 0 0;background:var(--card);border-radius:24px 24px 0 0;
    border:1px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,.4);padding:22px 18px 24px;
    position:relative;z-index:2;display:none;animation:slideUp .45s cubic-bezier(.22,.61,.36,1) both;}
  .card.visible{display:block;}
  @keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  .item-info{display:flex;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .item-thumb{width:76px;height:96px;border-radius:10px;background:var(--bg-2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;
    border:1px solid var(--border);}
  .item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
  .item-meta{flex:1;min-width:0;}
  .item-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;line-height:1.35;margin-bottom:6px;color:#fff;}
  .item-desc{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:8px;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--bg-2);color:var(--silver);
    border:1px solid var(--border);}
  .tag.free-tag{background:var(--accent);color:#fff;border-color:var(--accent);}

  .status-panel{background:var(--accent-pale);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:14px 0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .status-item{text-align:center;flex:1;}
  .status-num{font-size:20px;font-weight:800;color:var(--accent);font-family:'Playfair Display',serif;}
  .status-label{font-size:10.5px;color:var(--silver-dim);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.02em;}
  .status-divider{width:1px;align-self:stretch;background:var(--border);}

  .unlock-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .unlock-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;
    border-radius:var(--radius-btn);border:1.5px solid var(--border);background:var(--bg-2);color:var(--text);
    font-weight:700;font-size:13.5px;cursor:pointer;transition:opacity .15s,border-color .15s;}
  .unlock-btn .step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .unlock-btn .step-status{font-size:16px;flex-shrink:0;}
  .unlock-btn.done{border-color:var(--accent);color:var(--silver);opacity:.75;cursor:default;}
  .unlock-btn:disabled{opacity:.5;cursor:not-allowed;}

  .cta-btn{display:block;width:100%;padding:15px;border-radius:var(--radius-btn);border:none;
    background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;
    box-shadow:0 4px 18px rgba(255,79,160,.35);transition:opacity .15s;}
  .cta-btn:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;box-shadow:none;}
  .cta-btn:active:not(:disabled){opacity:.9;}

  .toast{display:none;text-align:center;font-size:12.5px;color:var(--accent);
    background:var(--accent-pale);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:10px;font-weight:700;}
  .toast.visible{display:block;}
  .toast.error{color:#FF8A8A;background:rgba(255,80,80,.1);}

  .more-btn{display:block;width:100%;text-align:center;padding:12px;margin-top:12px;border-radius:var(--radius-btn);
    background:transparent;border:1.5px solid var(--border);color:var(--silver);font-weight:700;font-size:13px;
    text-decoration:none;cursor:pointer;}

  .disclaimer-note{font-size:11px;color:var(--silver-dim);text-align:center;margin-top:18px;line-height:1.5;}
  #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99;display:none;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="header-bar">
    <button class="back-btn" onclick="history.back()">‹</button>
    <div class="logo-text">Free Library</div>
  </div>

  <div class="card" id="main-card">
    <div class="item-info">
      <div class="item-thumb" id="item-thumb">📖</div>
      <div class="item-meta">
        <div class="item-title" id="item-title">Loading…</div>
        <div class="item-desc" id="item-desc"></div>
        <div class="tags">
          <span class="tag" id="item-format"></span>
          <span class="tag" id="item-size"></span>
          <span class="tag" id="item-pages" style="display:none"></span>
          <span class="tag free-tag">FREE</span>
        </div>
      </div>
    </div>

    <!-- Two-step unlock: each button fires one Monetag Rewarded Popup.
         Both must complete before the real download link activates. -->
    <div class="unlock-steps">
      <button class="unlock-btn" id="btn-step1" onclick="runStep(1)">
        <span><span class="step-num">1</span> &nbsp;Complete step 1</span>
        <span class="step-status" id="step1-status">▶️</span>
      </button>
      <button class="unlock-btn" id="btn-step2" onclick="runStep(2)" disabled>
        <span><span class="step-num">2</span> &nbsp;Complete step 2</span>
        <span class="step-status" id="step2-status">🔒</span>
      </button>
    </div>

    <button class="cta-btn" id="btn-download" onclick="downloadNow()" disabled>📥 Download Now Free</button>
    <div class="toast" id="toast"></div>

    <a class="more-btn" id="more-link" href="#">🔎 More from this category</a>

    <div class="disclaimer-note">
      This is a free public-domain / open-source resource. No copyrighted
      or paid material is hosted here. Completing the two quick steps
      unlocks the download link — no payment, no account needed.
    </div>
  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); if (tg.disableClosingConfirmation) tg.disableClosingConfirmation(); }

// ── config ──────────────────────────────────────────────────
// Replaces the old Supabase REST calls entirely: item data comes from
// the static items.json committed alongside this page by pixel.py.
// This page does NOT track or display download counts at all — the
// channel post is the only place that number is shown (pulled straight
// from Pixeldrain's own API, refreshed hourly).
const ITEMS_JSON_URL     = './items.json';
const CHANNEL_JOIN_LINK  = 'https://t.me/+MhmkscCzIYQ2MmM8';

const CATEGORY_LABEL = { book: 'Books', summary: 'Cheat Sheets', project: 'Projects', article: 'Articles' };
const CATEGORY_EMOJI = { book: '📖', summary: '📝', project: '💻', article: '📰' };

let item        = null;
let step1Done   = false;
let step2Done   = false;

// ── Monetag: Rewarded Popup ────────────────────────────────
// show_11714447 comes from the SDK <script> tag in <head> (data-sdk attr).
function showRewardedPopup() {
  return new Promise((resolve) => {
    if (typeof show_11714447 !== 'function') {
      console.error('Monetag SDK not loaded');
      resolve(false);
      return;
    }
    show_11714447('pop').then(() => resolve(true)).catch((e) => {
      console.error('Monetag ad error', e);
      resolve(false);
    });
  });
}

// ── start_param decode ─────────────────────────────────────
function b64urlDecode(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function getStartParam() {
  return tg?.initDataUnsafe?.start_param
      || new URLSearchParams(window.location.search).get('startapp')
      || new URLSearchParams(window.location.search).get('id');
}

async function fetchItemsJson() {
  const res = await fetch(ITEMS_JSON_URL + '?t=' + Date.now());
  if (!res.ok) throw new Error('items.json HTTP ' + res.status);
  return res.json();
}

async function loadItem() {
  let itemId = null;
  const raw = getStartParam();
  if (raw) {
    try {
      const parsed = JSON.parse(b64urlDecode(raw));
      if (parsed && parsed.id) itemId = parsed.id;
    } catch (e) {
      if (/^\d+$/.test(raw)) itemId = Number(raw);
    }
  }
  if (!itemId) itemId = new URLSearchParams(window.location.search).get('id');

  // Retry a few times — right after publishing, GitHub Pages can take a
  // little while to serve the freshly-committed items.json.
  const attempts = 4;
  for (let i = 0; i < attempts && !item; i++) {
    try {
      const all = await fetchItemsJson();
      item = all.find(it => String(it.id) === String(itemId));
    } catch (e) {
      console.error('Failed to load items.json (attempt ' + (i + 1) + ')', e);
    }
    if (!item && i < attempts - 1) {
      await new Promise(r => setTimeout(r, 1500));
    }
  }

  if (!item) {
    console.error('Item not found. itemId =', itemId);
    document.getElementById('item-title').textContent = 'Item not found';
    document.getElementById('item-desc').textContent =
      'This link may be outdated, or the item is still syncing — please reopen it from the channel post in a moment.';
    document.getElementById('btn-step1').disabled = true;
    document.getElementById('btn-step2').disabled = true;
    document.getElementById('btn-download').disabled = true;
    showCard();
    showToast('⚠️ Item not found — try reopening from the channel post.', true);
    return;
  }

  document.getElementById('item-title').textContent = item.title;
  document.getElementById('item-desc').textContent = item.description || '';
  document.getElementById('item-format').textContent = item.format_label || '';
  document.getElementById('item-size').textContent = item.size_str || '';
  if (item.page_count) {
    const pg = document.getElementById('item-pages');
    pg.style.display = 'inline-block';
    pg.textContent = item.page_count + ' pages';
  }
  const thumb = document.getElementById('item-thumb');
  if (item.cover_url) {
    thumb.innerHTML = `<img src="${item.cover_url}" alt="cover" onerror="this.parentElement.textContent='${CATEGORY_EMOJI[item.category] || '📄'}'" />`;
  } else {
    thumb.textContent = CATEGORY_EMOJI[item.category] || '📄';
  }

  const moreLink = document.getElementById('more-link');
  moreLink.textContent = '📢 More free resources in the channel';
  moreLink.href = CHANNEL_JOIN_LINK;
  moreLink.addEventListener('click', (e) => {
    e.preventDefault();
    window.open(CHANNEL_JOIN_LINK);
  });

  showCard();
}

function showCard() { document.getElementById('main-card').classList.add('visible'); }

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible' + (isError ? ' error' : '');
}

async function runStep(n) {
  if (!item) {
    showToast('⚠️ Item not loaded — please reopen this page from the channel post.', true);
    return;
  }
  const btn = document.getElementById(`btn-step${n}`);
  const status = document.getElementById(`step${n}-status`);
  btn.disabled = true;
  status.textContent = '⏳';

  const ok = await showRewardedPopup();
  if (!ok) {
    status.textContent = '▶️';
    btn.disabled = false;
    showToast('No ad available right now — please try again.', true);
    return;
  }

  status.textContent = '✅';
  btn.classList.add('done');

  if (n === 1) {
    step1Done = true;
    document.getElementById('btn-step2').disabled = false;
  } else {
    step2Done = true;
  }

  if (step1Done && step2Done) {
    document.getElementById('btn-download').disabled = false;
    showToast('✅ Unlocked! Tap Download Now Free.');
  }
}

function downloadNow() {
  if (!item || !step1Done || !step2Done) {
    if (!item) showToast('⚠️ Item not loaded — please reopen this page from the channel post.', true);
    return;
  }
  openFile();
  launchConfetti();
  document.getElementById('btn-download').textContent = '📥 Download Again';
}

function openFile() {
  const url = item.file_url;
  if (tg && typeof tg.openLink === 'function') {
    tg.openLink(url, { try_instant_view: false });
  } else {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.click();
  }
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#FF4FA0', '#C7CEDD', '#0F1F42', '#EEF1F8', '#D6338A'];
  const pieces = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 3, d: Math.random() * 2 + 1,
    color: colors[Math.floor(Math.random()*colors.length)],
    tilt: Math.random()*10-5, tiltSpeed: (Math.random()*.07+.03) * (Math.random()<.5?1:-1),
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.beginPath(); ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r*0.4, p.tilt, 0, Math.PI*2); ctx.fill();
      p.y += p.d + frame/80; p.tilt += p.tiltSpeed; p.x += Math.sin(frame/20) * 0.5;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
    });
    frame++;
    if (frame < 150) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

window.addEventListener('load', loadItem);
</script>
</body>
</html>
