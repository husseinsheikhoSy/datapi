<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Free Library</title>

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<script>
(function() {
  var _origOpen = window.open;
  window.open = function(url, target, features) {
    if (url && typeof url === 'string' && url.indexOf('http') === 0) {
      var tgApp = window.Telegram && window.Telegram.WebApp;
      if (tgApp && typeof tgApp.openLink === 'function') {
        try { tgApp.openLink(url, { try_instant_view: false }); return null; } catch (e) {}
      }
      return _origOpen.call(window, url, '_blank', features);
    }
    return _origOpen.apply(window, arguments);
  };
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:             #0B1730;
    --bg-2:           #0F1F42;
    --card:           #142650;
    --text:           #EEF1F8;
    --text-muted:     #9AA6C4;
    --border:         #24365F;
    --accent:         #FF4FA0;
    --accent-dark:    #D6338A;
    --accent-pale:    rgba(255,79,160,.14);
    --silver:         #C7CEDD;
    --silver-dim:     #7C87A3;
    --radius-card:    16px;
    --radius-btn:     10px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;}
  .app-shell{width:100%;max-width:460px;margin:0 auto;padding-bottom:24px;}

  .top-bar{width:100%;background:linear-gradient(135deg,var(--bg-2) 0%,#1B2F5E 60%,var(--accent-dark) 140%);
    padding:18px 18px 44px;text-align:center;border-bottom:1px solid var(--border);}
  .top-bar h1{font-family:'Playfair Display',serif;color:#fff;font-size:22px;font-weight:800;
    text-shadow:0 0 18px rgba(255,79,160,.35);}
  .top-bar p{color:var(--silver);font-size:12.5px;margin-top:4px;}

  .action-row{display:flex;gap:8px;padding:0 16px;margin:-24px 0 12px;position:relative;z-index:2;}
  .action-chip{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 6px;text-align:center;font-size:11.5px;font-weight:700;color:var(--silver);
    cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .action-chip .emoji{display:block;font-size:18px;margin-bottom:2px;}

  .tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);
    font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:0 0 14px rgba(255,79,160,.45);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;}
  .grid-card{background:var(--card);border-radius:var(--radius-card);overflow:hidden;cursor:pointer;
    border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;flex-direction:column;}
  .grid-cover{width:100%;aspect-ratio:3/4;background:var(--bg-2);display:flex;align-items:center;
    justify-content:center;font-size:34px;overflow:hidden;}
  .grid-cover img{width:100%;height:100%;object-fit:cover;}
  .grid-body{padding:9px 10px 11px;}
  .grid-title{font-size:12.5px;font-weight:800;line-height:1.3;margin-bottom:5px;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .grid-meta{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--silver-dim);}
  .grid-tag{background:var(--accent-pale);color:var(--accent);font-weight:700;padding:2px 6px;border-radius:5px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,9,22,.7);z-index:50;
    align-items:flex-end;justify-content:center;}
  .modal-overlay.visible{display:flex;}
  .modal-sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;
    padding:22px 20px 28px;max-height:70vh;overflow-y:auto;border-top:1px solid var(--border);}
  .modal-sheet h3{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:10px;color:#fff;}
  .modal-sheet p{font-size:13px;line-height:1.6;color:var(--silver);white-space:pre-line;}
  .modal-close{margin-top:16px;width:100%;padding:12px;border-radius:var(--radius-btn);border:none;
    background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}

  .loading-row{grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);font-size:13px;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <h1>📚 Free Library</h1>
    <p>Public-domain &amp; open-source books, articles, cheat sheets &amp; projects</p>
  </div>

  <div class="action-row">
    <div class="action-chip" onclick="openModal('disclaimer')"><span class="emoji">🚫</span>Free &amp; Open-Source Only</div>
    <div class="action-chip" onclick="openModal('help')"><span class="emoji">❓</span>Help</div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">All</div>
    <div class="tab" data-cat="book">📖 Books</div>
    <div class="tab" data-cat="article">📰 Articles</div>
    <div class="tab" data-cat="summary">📝 Cheat Sheets</div>
    <div class="tab" data-cat="project">💻 Projects</div>
  </div>

  <div class="grid" id="grid">
    <div class="loading-row">Loading library…</div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <button class="modal-close" onclick="closeModal()">Got it</button>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); if (tg.disableClosingConfirmation) tg.disableClosingConfirmation(); }

// items.json is committed to this same GitHub Pages repo by the bot after
// every publish and every hourly refresh — it fully replaces the old
// Supabase REST endpoint. No external database is called from here.
const ITEMS_JSON_URL = './items.json';

const CATEGORY_EMOJI = { book: '📖', summary: '📝', project: '💻', article: '📰' };

const DISCLAIMER_TEXT =
`This bot is a free access point to public-domain and open-source resources only — books, cheat sheets, learning projects and articles shared to help students and self-learners.

We do not host, sell or distribute paid or copyrighted material. If you believe any item here infringes a copyright, contact the bot owner and it will be removed.

Everything here is free, forever.`;

const HELP_TEXT =
`1. Tap a tab to browse: Books, Articles, Cheat Sheets or Projects.
2. Tap any item to open its details page.
3. On the details page, complete the two quick unlock steps.
4. Once unlocked, tap Download.

No payment, no account needed — ever.`;

let allItems = [];
let currentCategory = 'all';

function b64urlDecode(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function getStartParam() {
  return tg?.initDataUnsafe?.start_param
      || new URLSearchParams(window.location.search).get('startapp');
}

function handleStartParam() {
  const raw = getStartParam();
  if (!raw) return false;
  try {
    const parsed = JSON.parse(b64urlDecode(raw));
    if (parsed && parsed.page === 'info' && parsed.id) {
      window.location.replace('info.html?id=' + encodeURIComponent(parsed.id) + '&startapp=' + encodeURIComponent(raw));
      return true;
    }
    if (parsed && parsed.page === 'index' && parsed.cat) {
      currentCategory = parsed.cat;
    }
  } catch (e) { /* ignore malformed payloads */ }
  return false;
}

function openModal(kind) {
  document.getElementById('modal-title').textContent = kind === 'disclaimer' ? '🚫 Free & Open-Source Only' : '❓ Help';
  document.getElementById('modal-body').textContent = kind === 'disclaimer' ? DISCLAIMER_TEXT : HELP_TEXT;
  document.getElementById('modal-overlay').classList.add('visible');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('visible'); }

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === currentCategory);
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const items = currentCategory === 'all'
    ? allItems
    : allItems.filter(it => it.category === currentCategory);

  if (!items.length) {
    grid.innerHTML = '<div class="empty-state">No items in this category yet — check back soon!</div>';
    return;
  }

  grid.innerHTML = items.map(it => `
    <div class="grid-card" data-id="${it.id}">
      <div class="grid-cover">
        ${it.cover_url
          ? `<img src="${it.cover_url}" alt="cover" onerror="this.parentElement.textContent='${CATEGORY_EMOJI[it.category] || '📄'}'" />`
          : (CATEGORY_EMOJI[it.category] || '📄')}
      </div>
      <div class="grid-body">
        <div class="grid-title">${escapeHtml(it.title)}</div>
        <div class="grid-meta">
          <span class="grid-tag">${CATEGORY_EMOJI[it.category] || ''} FREE</span>
          <span>${it.size_str || ''}</span>
        </div>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.grid-card').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = 'info.html?id=' + card.dataset.id;
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentCategory = tab.dataset.cat;
  renderTabs();
  renderGrid();
});

async function loadLibrary() {
  try {
    // cache-bust so the frontend doesn't show a stale copy of items.json
    const res = await fetch(ITEMS_JSON_URL + '?t=' + Date.now());
    allItems = await res.json();
  } catch (e) {
    console.error('Failed to load items.json', e);
    allItems = [];
  }
  renderTabs();
  renderGrid();
}

window.addEventListener('load', () => {
  const redirected = handleStartParam();
  if (redirected) return;
  loadLibrary();
});
</script>
</body>
</html>
